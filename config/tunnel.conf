# Bash configuration for tunnel-iran. Edit this file before deployment.
# Only use trusted config files: deployment scripts source this file as Bash.
SERVER_ROLE="foreign"

# Foreign server's public IPv4 or DNS name. The server script prompts if blank.
SERVER_PUBLIC_ENDPOINT=""

# WireGuard UDP listener on the foreign server
WG_LISTEN_PORT=51820

# Ports on the Iran-side server that should be forwarded to matching ports
# on the foreign server over WireGuard. Confirm this range matches your services.
FORWARD_PORT_START=10000
FORWARD_PORT_END=20000

# Keepalive and operational logging
HEALTH_CHECK_INTERVAL=30
RECONNECT_RETRY_DELAY=5
LOG_LEVEL="INFO"
